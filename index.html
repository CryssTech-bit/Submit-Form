<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form class="submit-form">

         <div class="input-wrapper">
        <label for="fname">Fullname</label>
        <input id="name" type="text" placeholder="Enter your fullname" />
      </div>

      <div class="input-wrapper">
<label for="date of birth">Date of Birth</label>
<input type="date" id="date of birth" placeholder="dd/mm/yyyy" >
          </div>

      <div class="input-wrapper">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="youremail@gmail.com" />
      </div>

      <div class="input-wrapper">
        <label for="state of origin">State of Origin</label>
        <input id="state of origin" type="state of origin" placeholder="Lagos State" >
      </div>

      <div class="input-wrapper">
        <label for="resident city">Resident City</label>
        <input id="city" type="city" placeholder="Abeokuta">


      </div>

      <div class="input-wrapper-marital">
        <label for="marital-status">Marital Status</label>
       <h5 class="h5">Single</h5><input type="radio" name="marital-status">
       <h5 class="h5">Married</h5><input type="radio" name="marital-status">
       <h5 class="h5">Widow</h5><input type="radio" name="marital-status">
       <h5 class="h5">Widower</h5><input type="radio" name="marital-status">
      </div>

      <div class="input-wrapper">
        <label for="home address">Home Address</label>
        <input id="address" type="address" placeholder="Enter your home address" />
      </div>

        
      <div class="button-wrapper">
        <button type="submit"></button>
      </div>
    </form>
    
</body>
</html>
